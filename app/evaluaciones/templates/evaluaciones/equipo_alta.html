{% extends "evaluaciones/base.html" %}

{% block titulo %}Alta de equipo{% endblock %}
{% block encabezado %}Alta de equipo{% endblock %}

{% block contenido %}
    <div class="card">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">Guardar</button>
            </form>
        </div>
    </div>

    <p class="mt-3">
        <a href="{% url 'evaluaciones:equipo_importar' %}">Importar equipos por lotes</a>
    </p>
{% endblock %}
